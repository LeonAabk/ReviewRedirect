<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videresender...</title>
  <!-- Offisiell Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 1.5rem;
    }

    /* Minimalistisk sentrert loading-spinner */
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1.25rem;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .status-text {
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      color: #94a3b8;
    }

    /* Feilmelding på skjermen */
    .error-card {
      display: none;
      max-width: 440px;
      width: 100%;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 2.25rem 2rem;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    .error-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .error-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 0.5rem;
    }

    .error-desc {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .error-badge {
      display: inline-block;
      font-family: monospace;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .btn-return {
      display: inline-block;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      transition: background 0.15s ease;
    }

    .btn-return:hover {
      background: #7dd3fc;
    }

    .config-note {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #64748b;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Loading spinner (vises først) -->
  <div id="loader" class="loader-container">
    <div class="spinner"></div>
    <div class="status-text">Kobler til omdirigering...</div>
  </div>

  <!-- Feilmelding (vises hvis rad ikke finnes eller lenke er ugyldig) -->
  <div id="error-card" class="error-card">
    <div class="error-icon">!</div>
    <h1 class="error-title" id="error-title">Ugyldig lenke</h1>
    <p class="error-desc" id="error-desc">
      Denne NFC- eller QR-koden er ikke registrert eller har utløpt.
    </p>
    <a href="admin.html" class="btn-return">Gå til Dashboard</a>
    <div id="config-hint" class="config-note" style="display: none;"></div>
  </div>

  <script>
    // =========================================================================
    // 1. SUPABASE KONFIGURASJON
    // =========================================================================
    const SUPABASE_URL = '';
    const SUPABASE_ANON_KEY = '';
    // =========================================================================

    // Hjelpefunksjon for å hente lagret config (dersom satt via admin/lokal lagring for rask testing)
    function getActiveCredentials() {
      try {
        const local = localStorage.getItem('supabase_config');
        if (local) {
          const parsed = JSON.parse(local);
          if (parsed.url && parsed.key) return parsed;
        }
      } catch (e) {}
      if (SUPABASE_URL && SUPABASE_ANON_KEY && !SUPABASE_URL.includes('DITT-PROSJEKT')) {
        return { url: SUPABASE_URL, key: SUPABASE_ANON_KEY };
      }
      return { url: SUPABASE_URL, key: SUPABASE_ANON_KEY, isDefault: true };
    }

    // Vis feilskjerm
    function showError(title, description, hint) {
      document.getElementById('loader').style.display = 'none';
      const card = document.getElementById('error-card');
      card.style.display = 'block';
      document.getElementById('error-title').textContent = title;
      document.getElementById('error-desc').innerHTML = description;
      if (hint) {
        const hintEl = document.getElementById('config-hint');
        hintEl.textContent = hint;
        hintEl.style.display = 'block';
      }
    }

    // Hovedfunksjon for omdirigering
    async function executeRedirect() {
      // 1. Les URL-parameteret ?id=...
      const urlParams = new URLSearchParams(window.location.search);
      const redirectId = urlParams.get('id');

      if (!redirectId || redirectId.trim() === '') {
        showError(
          'Mangler Kunde-ID',
          'Ingen gyldig parameter ble funnet i nettadressen.<br>Forventet format: <code>?id=kafe-hansen</code>.'
        );
        return;
      }

      const creds = getActiveCredentials();

      // Sjekk om Supabase-konfigurasjonen er fylt inn
      if (creds.isDefault && (!creds.url || creds.url.includes('DITT-PROSJEKT'))) {
        // Fallback for lokal testing før brukeren limer inn egne nøkler
        try {
          const localData = localStorage.getItem('mock_redirects');
          if (localData) {
            const list = JSON.parse(localData);
            const found = list.find(item => item.id.toLowerCase() === redirectId.toLowerCase());
            if (found && found.google_url) {
              found.clicks = (found.clicks || 0) + 1;
              localStorage.setItem('mock_redirects', JSON.stringify(list));
              window.location.replace(found.google_url);
              return;
            }
          }
        } catch (e) {}

        showError(
          'Supabase er ikke konfigurert',
          'Fyll inn <code>SUPABASE_URL</code> og <code>SUPABASE_ANON_KEY</code> øverst i <code>r.html</code> eller konfigurer det i Dashboard.',
          'Tips: Du kan konfigurere tilkoblingen under Dashboard -> Supabase Innstillinger.'
        );
        return;
      }

      // Initialiser Supabase-klienten via offisiell CDN
      if (typeof supabase === 'undefined' || !supabase.createClient) {
        showError(
          'Supabase bibliotek feilet',
          'Kunne ikke laste Supabase JS fra CDN. Sjekk internettforbindelsen.'
        );
        return;
      }

      const client = supabase.createClient(creds.url, creds.key);

      try {
        const cleanId = redirectId.trim();
        // 2. Oppslag i 'redirects'-tabellen etter id (case-insensitive)
        const { data, error } = await client
          .from('redirects')
          .select('id, google_url, clicks')
          .ilike('id', cleanId)
          .maybeSingle();

        if (error) {
          console.error('Supabase query error:', error);
          showError(
            'Databasefeil',
            `Det oppstod en feil ved oppslag i databasen: <br><span class="error-badge">${error.message}</span>`
          );
          return;
        }

        // 3. Hvis raden ikke finnes: vis feilmelding
        if (!data || !data.google_url) {
          showError(
            'Ugyldig eller ukjent lenke',
            `Fant ingen registrert omdirigering for ID: <br><span class="error-badge">${escapeHtml(redirectId)}</span>`
          );
          return;
        }

        // 4. Inkrementer clicks-kolonnen med 1
        const currentClicks = Number(data.clicks) || 0;
        try {
          await client
            .from('redirects')
            .update({ clicks: currentClicks + 1 })
            .eq('id', data.id);
        } catch (updateErr) {
          console.warn('Kunne ikke inkrementere klikk-teller (RLS eller tillatelse):', updateErr);
        }

        // Synkroniser lokal cache i localStorage dersom tilgjengelig
        try {
          const cached = localStorage.getItem('mock_redirects');
          if (cached) {
            const list = JSON.parse(cached);
            const item = list.find(r => r.id.toLowerCase() === cleanId.toLowerCase());
            if (item) {
              item.clicks = currentClicks + 1;
              localStorage.setItem('mock_redirects', JSON.stringify(list));
            }
          }
        } catch (cacheErr) {}

        // 5. Umiddelbar omdirigering til google_url
        let targetUrl = data.google_url.trim();
        if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
          targetUrl = 'https://' + targetUrl;
        }
        window.location.replace(targetUrl);

      } catch (err) {
        console.error('Uventet feil:', err);
        showError(
          'Systemfeil',
          'Det oppstod en uventet feil under omdirigeringen.'
        );
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Start ved lasting
    document.addEventListener('DOMContentLoaded', executeRedirect);
  </script>
</body>
</html>
